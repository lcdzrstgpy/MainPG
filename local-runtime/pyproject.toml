[project]
name = "wh-local-runtime"
version = "0.1.0"
description = "Local FastAPI runtime for H smart ecommerce workbench."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "cryptography>=43.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

