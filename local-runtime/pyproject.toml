[project]
name = "wh-local-runtime"
version = "0.1.0"
description = "Local FastAPI runtime for H smart ecommerce workbench."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "cryptography>=43.0",
  "openpyxl>=3.1,<4",
  "Pillow>=11.0,<13",
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
  "tzdata>=2024.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
