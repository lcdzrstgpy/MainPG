<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>界野邮箱验证码</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,'Microsoft YaHei',sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f7fb;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #e7ebf2;border-radius:14px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 18px;background:#172554;color:#ffffff;">
                <div style="font-size:22px;font-weight:700;line-height:1.4;">界野</div>
                <div style="margin-top:6px;font-size:13px;line-height:1.6;color:#c7d2fe;">邮箱安全验证</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <div style="font-size:18px;font-weight:700;line-height:1.6;">您好，</div>
                <p style="margin:12px 0 22px;font-size:14px;line-height:1.8;color:#4b5563;">
                  您正在进行界野账号注册或安全验证，请使用以下验证码完成操作：
                </p>
                <div style="padding:18px 12px;text-align:center;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;font-size:32px;font-weight:700;letter-spacing:8px;color:#3730a3;">
                  {{code}}
                </div>
                <p style="margin:22px 0 0;font-size:14px;line-height:1.8;color:#4b5563;">
                  验证码将在 10 分钟后失效，请勿向任何人泄露。如果不是您本人操作，请忽略本邮件。
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;border-top:1px solid #eef0f4;font-size:12px;line-height:1.7;color:#8a94a6;">
                此邮件由界野系统自动发送，请勿直接回复。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
