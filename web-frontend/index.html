<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="界野电商平台" />
    <script>
      (() => {
        const recoveryKey = "mainpg_asset_recovery_v1";
        const assetPathPrefix = "/assets/";

        const recover = () => {
          if (window.sessionStorage.getItem(recoveryKey) === "retrying") return;
          window.sessionStorage.setItem(recoveryKey, "retrying");
          const recoveryUrl = new URL(window.location.href);
          recoveryUrl.searchParams.set("asset_retry", String(Date.now()));
          window.location.replace(recoveryUrl.toString());
        };

        const isWorkbenchAsset = (target) => {
          if (!target || !target.tagName) return false;
          const tagName = String(target.tagName).toUpperCase();
          if (tagName !== "LINK" && tagName !== "SCRIPT") return false;
          const source = tagName === "LINK" ? target.href : target.src;
          if (!source) return false;
          try {
            return new URL(source, window.location.href).pathname.startsWith(assetPathPrefix);
          } catch (_) {
            return false;
          }
        };

        // iconfont 未加载成功时，PUA 图标码点会回退到系统字体渲染成异常字形（乱码）。
        // 字体加载失败不会触发 window 的 error 事件，因此单独检测并及时恢复。
        const isIconFontFailed = () => {
          try {
            return Array.from(document.fonts || []).some((face) => {
              const family = String(face.family || "").replace(/^["']|["']$/g, "").toLowerCase();
              return family === "iconfont" && face.status === "error";
            });
          } catch (_) {
            return false;
          }
        };

        window.addEventListener("error", (event) => {
          if (!isWorkbenchAsset(event.target)) return;
          recover();
        }, true);

        window.addEventListener("load", () => {
          const settle = () => {
            window.setTimeout(() => {
              const rootReady = Boolean(document.querySelector("#root")?.childElementCount);
              const stylesheetReady = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
                .every((link) => Boolean(link.sheet));
              if (isIconFontFailed()) {
                recover();
                return;
              }
              if (rootReady && stylesheetReady) {
                window.sessionStorage.removeItem(recoveryKey);
              }
            }, 1500);
          };
          if (document.fonts && typeof document.fonts.ready?.then === "function") {
            document.fonts.ready.then(settle, settle);
          } else {
            settle();
          }
        });
      })();
    </script>
    <link rel="icon" type="image/png" href="/brand/jieye-mark.png" />
    <title>界野电商平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
