<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>公告发布后台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #1d3a55;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(140deg, #eef6fd, #e9f6f4);
    }
    .shell { max-width: 860px; margin: 0 auto; padding: 34px 18px 60px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .brand-mark {
      display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
      color: #fff; font-weight: 900; font-size: 1.2rem;
      background: linear-gradient(145deg, #008bff, #16d7c0);
      box-shadow: 0 10px 22px rgba(9, 145, 220, .25);
    }
    .brand h1 { margin: 0; font-size: 1.25rem; letter-spacing: -.02em; }
    .brand p { margin: 2px 0 0; color: #7b93a9; font-size: .82rem; }
    .card {
      border: 1px solid #d9e7f2; border-radius: 18px; background: #fff;
      box-shadow: 0 16px 40px rgba(28, 75, 108, .1);
    }
    .auth-card { max-width: 420px; margin: 60px auto 0; padding: 34px; }
    .auth-card h2 { margin: 0 0 22px; font-size: 1.3rem; }
    .auth-tip { margin: 0 0 18px; color: #778da3; font-size: .85rem; line-height: 1.6; }
    label { display: grid; gap: 7px; margin: 15px 0 0; font-size: .85rem; font-weight: 750; color: #4b617a; }
    input, textarea {
      width: 100%; border: 1px solid #d3e1ec; border-radius: 10px; padding: 12px 13px;
      font-size: .95rem; color: #13233a; background: #fbfdff; outline-color: #1e91e6;
      font-family: inherit;
    }
    textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
    input:focus, textarea:focus { border-color: #6cc1f2; background: #fff; }
    button {
      border: 1px solid #cfe0eb; border-radius: 10px; padding: 11px 16px;
      color: #2f5878; background: #fff; font-weight: 800; cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    button:hover:not(:disabled) { border-color: #82c9ef; box-shadow: 0 8px 18px rgba(24, 139, 214, .15); }
    button:active:not(:disabled) { transform: scale(.985); }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .primary-button {
      border: 0; color: #fff; padding: 13px 18px; width: 100%; margin-top: 22px;
      background: linear-gradient(105deg, #087bf5, #14c8c0);
      box-shadow: 0 12px 24px rgba(11, 147, 220, .25);
    }
    .message { margin-top: 16px; padding: 11px 13px; border-radius: 10px; font-size: .85rem; line-height: 1.5; }
    .message.error { border: 1px solid #ffd0d2; color: #b00020; background: #fff2f2; }
    .message.ok { border: 1px solid #bde8d4; color: #087746; background: #effcf5; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .toolbar h2 { margin: 0; font-size: 1.2rem; }
    .toolbar button { padding: 8px 13px; font-size: .83rem; }
    .editor-card { padding: 22px; margin-bottom: 18px; }
    .editor-card h3 { margin: 0 0 14px; font-size: 1.02rem; }
    .editor-actions { display: flex; gap: 10px; margin-top: 16px; }
    .editor-actions button { flex: 1; }
    .editor-actions .secondary { border-color: #e1ebf2; color: #5d7185; background: #f7f9fb; }
    .list-card { padding: 10px 18px 18px; }
    .empty-tip { padding: 34px 0; text-align: center; color: #8aa0b4; }
    .item { padding: 15px 0; border-bottom: 1px solid #e9f0f6; }
    .item:last-child { border-bottom: 0; }
    .item-head { display: flex; align-items: center; gap: 10px; }
    .item-head strong { font-size: 1rem; }
    .status-badge { padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 850; }
    .status-badge.on { color: #07966f; background: #e8faf4; }
    .status-badge.off { color: #8a6d3b; background: #faf3e2; }
    .item-time { margin-left: auto; color: #8aa0b4; font-size: .78rem; white-space: nowrap; }
    .item-content { margin: 8px 0 10px; color: #4c637b; font-size: .88rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .item-actions button { padding: 6px 11px; font-size: .78rem; border-radius: 8px; }
    .item-actions .danger { color: #d75b65; border-color: #ffd5d5; background: #fff8f8; }
    .item-actions .danger:hover { border-color: #f2a3a9; }
    .item-actions .is-confirming { color: #fff; border-color: #d75b65; background: #d75b65; }
    .item-actions .is-confirming:hover { border-color: #c24a54; }
    .foot { margin-top: 26px; text-align: center; color: #93a7b9; font-size: .78rem; }
    @media (max-width: 640px) { .shell { padding: 20px 12px 48px; } .auth-card { margin-top: 34px; padding: 26px; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="brand-mark">告</div>
      <div>
        <h1>公告发布后台</h1>
        <p>发布平台公告，客户端工作台会自动同步并在右上角显示</p>
      </div>
    </div>

    <div id="viewSetup" class="card auth-card" hidden>
      <h2>首次使用，创建管理员</h2>
      <p class="auth-tip">这是第一次访问，请设置管理员的账号和密码。创建后即自动登录，后续用同一账号进入后台。</p>
      <label>管理员账号<input id="setupUsername" autocomplete="username" placeholder="至少 2 个字符" /></label>
      <label>管理员密码<input id="setupPassword" type="password" autocomplete="new-password" placeholder="至少 6 位" /></label>
      <button class="primary-button" id="setupButton">创建并进入后台</button>
      <div id="setupMessage" class="message" hidden></div>
    </div>

    <div id="viewLogin" class="card auth-card" hidden>
      <h2>登录后台</h2>
      <label>管理员账号<input id="loginUsername" autocomplete="username" /></label>
      <label>密码<input id="loginPassword" type="password" autocomplete="current-password" /></label>
      <button class="primary-button" id="loginButton">登录</button>
      <div id="loginMessage" class="message" hidden></div>
    </div>

    <div id="viewAdmin" hidden>
      <div class="toolbar">
        <h2>公告管理</h2>
        <div>
          <button id="refreshButton">刷新</button>
          <button id="logoutButton">退出登录</button>
        </div>
      </div>

      <div class="card editor-card">
        <h3 id="editorTitle">发布新公告</h3>
        <label>标题<input id="editTitle" placeholder="公告标题" /></label>
        <label style="margin-top:14px">正文<textarea id="editContent" placeholder="公告内容，支持多行文本"></textarea></label>
        <div class="editor-actions">
          <button class="primary-button" style="margin-top:16px" id="saveButton">发布公告</button>
          <button class="secondary" style="margin-top:16px" id="cancelEditButton" hidden>取消编辑</button>
        </div>
        <div id="adminMessage" class="message" hidden></div>
      </div>

      <div class="card list-card">
        <div id="listEmpty" class="empty-tip" hidden>暂无公告，发布第一条吧。</div>
        <div id="list"></div>
      </div>
    </div>

    <div class="foot">公告发布后台 · 客户端每 5 分钟自动同步</div>
  </div>

  <script>
    const TOKEN_KEY = "wh_announce_token";
    let token = sessionStorage.getItem(TOKEN_KEY) || "";
    let editingId = null;
    let items = [];
    let confirmingDeleteId = null;

    const $ = (id) => document.getElementById(id);

    function showMessage(el, text, type) {
      el.hidden = false;
      el.textContent = text;
      el.className = "message " + (type || "error");
    }
    function clearMessage(el) { el.hidden = true; el.textContent = ""; }

    async function api(path, options) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers.Authorization = "Bearer " + token;
      const response = await fetch(path, { ...options, headers });
      let payload = {};
      try { payload = await response.json(); } catch (_) {}
      if (!response.ok) {
        const detail = payload.detail || ("请求失败 (HTTP " + response.status + ")");
        if (response.status === 401) {
          token = "";
          sessionStorage.removeItem(TOKEN_KEY);
          render();
        }
        throw new Error(detail);
      }
      return payload;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function formatTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      const pad = (n) => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
        + " " + pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function renderList() {
      $("listEmpty").hidden = items.length > 0;
      const list = $("list");
      list.innerHTML = items.map((item) => {
        const on = item.active;
        const confirming = confirmingDeleteId === item.id;
        return (
          '<div class="item">' +
            '<div class="item-head">' +
              '<span class="status-badge ' + (on ? "on" : "off") + '">' + (on ? "已上线" : "已下线") + "</span>" +
              "<strong>" + escapeHtml(item.title) + "</strong>" +
              '<span class="item-time">' + formatTime(item.published_at) + "</span>" +
            "</div>" +
            (item.content ? '<div class="item-content">' + escapeHtml(item.content) + "</div>" : "") +
            '<div class="item-actions">' +
              '<button data-action="edit" data-id="' + item.id + '">编辑</button>' +
              '<button data-action="publish" data-id="' + item.id + '">' + (on ? "下线" : "上线") + "</button>" +
              (confirming
                ? '<button class="danger is-confirming" data-action="delete" data-id="' + item.id + '">确认删除？</button><button data-action="cancel-delete" data-id="' + item.id + '">取消</button>'
                : '<button class="danger" data-action="delete" data-id="' + item.id + '">删除</button>') +
            "</div>" +
          "</div>"
        );
      }).join("");
    }

    async function loadAnnouncements() {
      const payload = await api("/api/announcements");
      items = payload.announcements || [];
      renderList();
    }

    async function refreshList() {
      try {
        await loadAnnouncements();
      } catch (err) {
        showMessage($("adminMessage"), err.message);
      }
    }

    function enterEdit(item) {
      editingId = item.id;
      $("editTitle").value = item.title;
      $("editContent").value = item.content || "";
      $("editorTitle").textContent = "编辑公告 #" + item.id;
      $("saveButton").textContent = "保存修改";
      $("cancelEditButton").hidden = false;
    }

    function resetEditor() {
      editingId = null;
      $("editTitle").value = "";
      $("editContent").value = "";
      $("editorTitle").textContent = "发布新公告";
      $("saveButton").textContent = "发布公告";
      $("cancelEditButton").hidden = true;
    }

    function showAdmin() {
      $("viewSetup").hidden = true;
      $("viewLogin").hidden = true;
      $("viewAdmin").hidden = false;
      resetEditor();
      refreshList();
    }

    function render() {
      const needsSetup = sessionStorage.getItem("wh_announce_needs_setup") === "1";
      if (token) { showAdmin(); return; }
      if (needsSetup) {
        $("viewSetup").hidden = false;
        $("viewLogin").hidden = true;
        $("viewAdmin").hidden = true;
      } else {
        $("viewSetup").hidden = true;
        $("viewLogin").hidden = false;
        $("viewAdmin").hidden = true;
      }
    }

    async function boot() {
      try {
        const status = await api("/api/setup-status");
        sessionStorage.setItem("wh_announce_needs_setup", status.needs_setup ? "1" : "0");
      } catch (_) {
        // 服务不可达时按当前状态渲染
      }
      render();
    }

    // ---- 事件 ----
    $("setupButton").addEventListener("click", async () => {
      clearMessage($("setupMessage"));
      $("setupButton").disabled = true;
      try {
        const payload = await api("/api/setup", {
          method: "POST",
          body: JSON.stringify({
            username: $("setupUsername").value.trim(),
            password: $("setupPassword").value,
          }),
        });
        token = payload.token;
        sessionStorage.setItem(TOKEN_KEY, token);
        sessionStorage.setItem("wh_announce_needs_setup", "0");
        showAdmin();
      } catch (err) {
        showMessage($("setupMessage"), err.message);
      } finally {
        $("setupButton").disabled = false;
      }
    });

    $("loginButton").addEventListener("click", async () => {
      clearMessage($("loginMessage"));
      $("loginButton").disabled = true;
      try {
        const payload = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({
            username: $("loginUsername").value.trim(),
            password: $("loginPassword").value,
          }),
        });
        token = payload.token;
        sessionStorage.setItem(TOKEN_KEY, token);
        showAdmin();
      } catch (err) {
        showMessage($("loginMessage"), err.message);
      } finally {
        $("loginButton").disabled = false;
      }
    });

    $("saveButton").addEventListener("click", async () => {
      clearMessage($("adminMessage"));
      $("saveButton").disabled = true;
      try {
        const body = {
          title: $("editTitle").value.trim(),
          content: $("editContent").value,
        };
        if (editingId == null) {
          await api("/api/announcements", { method: "POST", body: JSON.stringify(body) });
        } else {
          await api("/api/announcements/" + editingId, { method: "PATCH", body: JSON.stringify(body) });
        }
        resetEditor();
        showMessage($("adminMessage"), editingId == null ? "已发布" : "已保存", "ok");
        await loadAnnouncements();
      } catch (err) {
        showMessage($("adminMessage"), err.message);
      } finally {
        $("saveButton").disabled = false;
      }
    });

    $("cancelEditButton").addEventListener("click", resetEditor);
    $("refreshButton").addEventListener("click", refreshList);

    $("logoutButton").addEventListener("click", () => {
      token = "";
      sessionStorage.removeItem(TOKEN_KEY);
      render();
    });

    $("list").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = Number(button.dataset.id);
      const action = button.dataset.action;
      clearMessage($("adminMessage"));
      try {
        if (action === "edit") {
          const payload = await api("/api/announcements");
          const item = (payload.announcements || []).find((row) => row.id === id);
          if (item) enterEdit(item);
        } else if (action === "publish") {
          const payload = await api("/api/announcements");
          const item = (payload.announcements || []).find((row) => row.id === id);
          if (item) {
            await api("/api/announcements/" + id + "/publish", {
              method: "POST",
              body: JSON.stringify({ active: !item.active }),
            });
            await loadAnnouncements();
          }
        } else if (action === "delete") {
          if (confirmingDeleteId !== id) {
            confirmingDeleteId = id;
            renderList();
            return;
          }
          await api("/api/announcements/" + id, { method: "DELETE" });
          confirmingDeleteId = null;
          items = items.filter((row) => row.id !== id);
          if (editingId === id) resetEditor();
          renderList();
        } else if (action === "cancel-delete") {
          confirmingDeleteId = null;
          renderList();
        }
      } catch (err) {
        showMessage($("adminMessage"), err.message);
      }
    });

    boot();
  </script>
</body>
</html>
