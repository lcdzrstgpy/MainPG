<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 280px; margin: 0; font-family: "Microsoft YaHei", sans-serif; color: #152033; }
      main { padding: 14px; }
      label { display: block; font-size: 12px; margin: 10px 0 4px; color: #5c6b80; }
      input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
      button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 6px; background: #0ea5a4; color: #fff; cursor: pointer; }
      #company { display: inline-block; margin-top: 8px; padding: 4px 7px; border-radius: 999px; background: #fff7ed; color: #9a3412; font-size: 12px; font-weight: 700; }
      #company[data-connected="true"] { background: #ecfdf5; color: #047857; }
      #status { margin-top: 10px; font-size: 12px; color: #334155; }
    </style>
  </head>
  <body>
    <main>
      <strong>TEMU Y2 AI 工作台</strong>
      <label>工作台地址</label>
      <input id="baseUrl" value="https://workbench.haocoming.top" placeholder="https://内部工作台域名" />
      <label>插件连接码</label>
      <input id="token" type="password" />
      <button id="save">保存连接</button>
      <button id="connect">连接插件</button>
      <div id="company">公司未确认</div>
      <div id="status">待连接</div>
    </main>
    <script src="tenant_context.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
